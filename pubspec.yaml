name: passkeep
description: "An offline-first, Zero-Knowledge password manager built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local DB & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Backend & Synchronization
  supabase_flutter: ^2.8.4

  # Security, Auth & Cryptography
  encrypt: ^5.0.3
  crypto: ^3.0.6
  local_auth: ^2.3.0

  # Utilities
  uuid: ^4.5.1
  share_plus: ^12.0.2
  file_picker: ^11.0.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/splash/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#0F172A"
  color_dark: "#0F172A"
  image: "assets/splash/splash.png"
  image_dark: "assets/splash/splash.png"
  android_12:
    color: "#0F172A"
    color_dark: "#0F172A"
    image: "assets/splash/splash.png"
    image_dark: "assets/splash/splash.png"

